<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Créer, ranger et exporter ses fiches de révision du DSCG.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A1A18'/%3E%3Cpath d='M10 10h12M10 16h12M10 22h7' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Fiches DSCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--panel:#F7F7F5;--border:#E4E4E0;--strong:#CFCFC9;--text:#1A1A18;--muted:#5E5E58;--active:#F0F0EC;--stage:#F2F2EF;--input:#FFFFFF;--ink:#1A1A18;--focus:#2457D6}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--text)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
/* top bar */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:4px;padding:0 24px;height:58px;background:#fff;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;margin-right:22px;text-decoration:none;color:var(--text);flex:none}
.logo i{width:22px;height:22px;border-radius:4px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.logo i .ico{width:13px;height:13px}
.logo b{font-family:'Source Serif 4',Georgia,serif;font-size:19px;font-weight:600}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;height:100%}
.nav::-webkit-scrollbar{display:none}
.nav a,.nav button{flex:none;height:100%;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nav a:hover,.nav button:hover{color:var(--text)}
.nav .on{color:var(--text);border-bottom-color:var(--ink)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none;margin-right:10px}
.sync i{width:7px;height:7px;border-radius:9px;background:#2E9E62}
.sync.warn i{background:#D97706}
.btn{min-height:38px;padding:0 14px;border-radius:6px;border:1px solid var(--strong);background:#fff;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--text);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--active)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#33332F}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--active)}
.btn.danger{color:#B42318}
.btn[disabled]{opacity:.4;cursor:default;background:#fff}
.ico{width:16px;height:16px;flex:none}
.menu-pop{position:fixed;z-index:80;background:#fff;border:1px solid var(--border);border-radius:8px;padding:4px;min-width:280px;box-shadow:0 8px 24px rgba(20,20,18,.10)}
.menu-pop button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;background:transparent;border-radius:5px;text-align:left;font-size:14px}
.menu-pop button:hover{background:var(--active)}
.dot{width:9px;height:9px;border-radius:2px;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text);flex:none;white-space:nowrap}
.tag .dot{width:8px;height:8px}
.pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:12px;font-weight:700;flex:none}
/* layout */
.wrap{max-width:1120px;margin:0 auto;padding:36px 24px 72px}
.ptitle{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;padding-bottom:22px;border-bottom:1px solid var(--border)}
.ptitle h1{font-size:30px}
.ptitle p{margin:6px 0 0;color:var(--muted);font-size:14px}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid var(--strong);border-radius:6px;background:#fff;width:100%;max-width:640px;color:var(--muted)}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;border:0;outline:none;background:transparent;font-size:15px;min-width:0;color:var(--text)}
.search small{font-size:12px;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--strong);border-radius:6px;overflow:hidden;width:max-content;max-width:100%}
.tabs button{min-height:36px;padding:0 13px;border:0;border-left:1px solid var(--border);background:#fff;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;color:var(--muted)}
.tabs button:first-child{border-left:0}
.tabs button:hover{color:var(--text);background:var(--active)}
.tabs button.on{background:var(--active);color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.sec{display:flex;flex-direction:column;gap:14px;margin-top:40px}
.sec h2{font-size:21px}
.sec p.d{margin:-8px 0 0;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{text-align:left;padding:14px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--strong);background:#FCFCFB}
.tile.on{border-color:var(--ink)}
.tile .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile .n{font-size:15px;font-weight:600;line-height:1.35}
.tile .m{font-size:13px;color:var(--muted)}
.list{border-top:1px solid var(--border)}
.list a{display:flex;align-items:center;gap:16px;min-height:52px;padding:8px 4px;border-bottom:1px solid var(--border);color:var(--text);text-decoration:none}
.list a:hover{background:#FAFAF8}
.list .ti{flex:1;min-width:0;font-weight:500}
.list .mt{font-size:13px;color:var(--muted);white-space:nowrap}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--strong);border-radius:8px;display:flex;flex-direction:column;gap:12px;align-items:center}
.panel{padding:20px;border-radius:8px;border:1px solid var(--border);background:#fff;display:flex;flex-direction:column;gap:10px}
.lab{font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;min-height:50px;border-top:1px solid var(--border)}
.row input[type=text]{flex:1;min-width:0;height:36px;padding:0 10px;border-radius:6px;border:1px solid var(--strong);background:#fff}
input[type=color]{width:40px;height:32px;padding:2px;border:1px solid var(--strong);border-radius:6px;background:#fff;flex:none}
.two{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.two>*{flex:1 1 420px;min-width:0}
/* library */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:20px}
.filters select{height:36px;padding:0 8px;border-radius:6px;border:1px solid var(--strong);background:#fff;font-size:13px}
.filters label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:20px}
.card{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card:hover{border-color:var(--strong)}
.card.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.thumb{height:168px;overflow:hidden;position:relative;background:var(--stage);border:0;border-bottom:1px solid var(--border);padding:0;width:100%;cursor:pointer}
.card .ck{position:absolute;top:8px;left:8px;width:32px;height:32px;border-radius:5px;background:#fff;border:1px solid var(--strong);display:flex;align-items:center;justify-content:center;z-index:3}
.card .ck input{width:16px;height:16px;margin:0;accent-color:#1A1A18}
.card .np{position:absolute;top:10px;right:10px;padding:2px 7px;border-radius:4px;background:#fff;border:1px solid var(--border);color:var(--muted);font-size:12px;z-index:3}
.card .cb{padding:12px 14px 12px;display:flex;flex-direction:column;gap:6px}
.card .cm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.card h3{font-size:16px;line-height:1.3}
.card .ca{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;margin-left:-6px}
/* editor */
.ed{display:flex;flex-direction:column;height:calc(100vh - 58px)}
.ehead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 20px;border-bottom:1px solid var(--border);background:#fff}
.ehead input.title{flex:1 1 260px;min-width:0;height:40px;padding:0 10px;border-radius:6px;border:1px solid transparent;background:transparent;font-family:'Source Serif 4',Georgia,serif;font-size:21px;font-weight:600}
.ehead input.title:hover,.ehead input.title:focus{border-color:var(--strong)}
.ehead select,.ehead input.th{height:34px;padding:0 8px;border-radius:6px;border:1px solid var(--strong);background:#fff;font-size:13px}
.ehead input.th{width:180px}
.estat{font-size:12px;color:var(--muted);white-space:nowrap;min-width:150px;text-align:right}
.estat.dirty{color:#B45309}
.tools{display:flex;align-items:center;gap:2px;padding:4px 14px;border-bottom:1px solid var(--border);background:#fff;overflow-x:auto;scrollbar-width:thin}
.tb{flex:none;min-width:36px;height:36px;padding:0 9px;border-radius:5px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;color:var(--text);white-space:nowrap}
.tb:hover{background:var(--active)}
.tb.on{background:var(--active);border-color:var(--strong)}
.tb[disabled]{opacity:.3}
.tsep{flex:none;width:1px;height:22px;background:var(--border);margin:0 6px}
.props{display:flex;align-items:center;gap:2px;flex:none}
.props .hint{font-size:12px;color:var(--muted);padding:0 6px;white-space:nowrap}
.ebody{flex:1;display:flex;min-height:0}
.plan{width:290px;flex:none;padding:16px;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;gap:12px;overflow:auto}
.plan textarea{width:100%;min-height:220px;flex:1;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.7;padding:10px 12px;border:1px solid var(--strong);border-radius:6px;resize:vertical;background:#fff}
.plan p{margin:0;font-size:12px;line-height:1.55;color:var(--muted)}
.plan code{font-size:11.5px;background:#fff;border:1px solid var(--border);padding:0 4px;border-radius:3px}
.seg{display:inline-flex;border:1px solid var(--strong);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{min-height:32px;padding:0 10px;border:0;border-left:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--active);color:var(--text);font-weight:600}
.plan .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.plan .seg button{padding:0 4px}
.stage{flex:1;overflow:auto;background:var(--stage);padding:28px 20px;min-width:0}
.pw{position:relative;margin:0 auto;flex:none}
.pw>.page{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06)}
.strip{display:flex;align-items:center;gap:6px;padding:6px 16px;border-top:1px solid var(--border);background:#fff;overflow-x:auto}
.pg{flex:none;width:34px;height:44px;border-radius:4px;border:1px solid var(--strong);background:#fff;color:var(--muted);font-weight:600;font-size:13px}
.pg.on{border-color:var(--ink);color:var(--text);box-shadow:inset 0 0 0 1px var(--ink)}
.strip .lab2{font-size:12px;color:var(--muted);white-space:nowrap;margin-right:4px}
.hintpage{position:absolute;left:48px;right:48px;top:240px;z-index:0;border:1px dashed #CFCFC9;border-radius:8px;padding:28px;color:#5E5E58;font-size:15px;line-height:1.6;text-align:center;pointer-events:none}
/* reader */
.rhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.rhead h1{font-size:26px;flex:1 1 260px}
.pages{display:flex;flex-direction:column;align-items:center;gap:20px}
.rbg{background:var(--stage);border-radius:8px;padding:24px 12px}
/* modal & toast */
.ov{position:fixed;inset:0;z-index:100;background:rgba(20,20,18,.35);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(500px,100%);background:#fff;border:1px solid var(--border);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(20,20,18,.18)}
.modal h2{font-size:21px}
.modal label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.modal input,.modal select{height:40px;padding:0 10px;border-radius:6px;border:1px solid var(--strong);background:#fff;font-size:15px;color:var(--text);font-weight:400}
.modal .act{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:#1A1A18;color:#fff;padding:11px 16px;border-radius:6px;font-size:14px;max-width:90vw}
.busy{position:fixed;inset:0;z-index:110;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:15px;font-weight:600}
#measure{position:absolute;left:-20000px;top:0;visibility:hidden}
#exporthost{position:fixed;left:-20000px;top:0}
/* ============ PAPER (fiche pages) ============ */
.page{position:relative;width:794px;height:1123px;background:#fff;color:#111827;font-family:Inter,system-ui,sans-serif;overflow:hidden;flex:none;font-size:15px;line-height:1.45}
.page .ph{position:absolute;left:48px;right:48px;top:40px;padding-bottom:14px;display:flex;flex-direction:column;gap:8px}
.page .ph .r1{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#4B5563}
.page .ph .r1 .dt{margin-left:auto;font-weight:400;font-size:12px}
.page .ph h1{font-family:'Source Serif 4',Georgia,serif;font-size:30px;line-height:1.15;color:#111827;font-weight:700;margin:0}
.page .ph.small{flex-direction:row;align-items:center;gap:10px;padding-bottom:10px}
.page .ph.small b{font-size:14px}
.page .ph.small span.su{margin-left:auto;font-size:12px;color:#4B5563}
.page .pf{position:absolute;left:48px;right:48px;bottom:28px;display:flex;justify-content:space-between;font-size:11px;color:#4B5563;padding-top:8px;border-top:1px solid #E5E7EB}
.page svg.ar{position:absolute;left:0;top:0;z-index:1;pointer-events:none;overflow:visible}
.page svg.ar .hit{pointer-events:stroke;cursor:pointer}
.it{position:absolute;z-index:2}
.ed .it{touch-action:none;cursor:grab}
.ed .it.editing{cursor:text}
.node{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:translate(-50%,-50%);padding:10px 16px;min-width:90px;min-height:42px;border-radius:10px;line-height:1.25;overflow-wrap:break-word}
.node.auto{width:max-content;max-width:230px}
.node.oval{border-radius:999px;padding:12px 26px}
.node.diamond{padding:22px 44px;min-height:80px;border:0!important;background:transparent!important}
.node .t{font-weight:700;font-size:14.5px}
.node .s{font-size:11.5px;margin-top:3px;font-weight:500;opacity:.9}
.node .dbg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1;overflow:visible}
.node [data-edit]{white-space:pre-wrap;outline:none;min-width:20px}
.box{border-radius:12px;padding:12px 14px}
.box .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.box .bt{font-size:14.5px;line-height:1.5;color:#111827;min-height:20px;outline:none}
.box .bt.raw,.txt .bt.raw,.formula .bt.raw{white-space:pre-wrap}
.txt .bt{outline:none;color:#111827;min-height:20px}
.txt.title .bt{font-family:'Source Serif 4',Georgia,serif;font-size:26px;font-weight:700;line-height:1.2}
.txt.h2 .bt{font-family:'Source Serif 4',Georgia,serif;font-size:19px;font-weight:700;line-height:1.3}
.txt.body .bt{font-size:15px;line-height:1.55}
.formula{padding:12px 16px;border:1px solid #D1D5DB;border-radius:12px;background:#fff}
.formula .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#374151;margin-bottom:6px;font-family:Inter}
.formula .bt{font-family:Georgia,'Times New Roman',serif;font-size:19px;text-align:center;outline:none;line-height:1.6}
.formula sub,.formula sup{font-size:12px}
.tbl table{width:100%;border-collapse:separate;border-spacing:0;border-radius:12px;overflow:hidden;font-size:14px;line-height:1.4;table-layout:fixed}
.tbl td{padding:10px 12px;vertical-align:top;outline:none;word-wrap:break-word}
.it.sel{outline:2px solid #2563EB;outline-offset:4px}
.it.editing{outline:2px solid #2457D6;outline-offset:4px}
.it.from{outline:2px dashed #2457D6;outline-offset:4px}
.rh{position:absolute;right:-11px;bottom:-11px;width:16px;height:16px;background:#fff;border:2px solid #2563EB;border-radius:4px;cursor:nwse-resize;z-index:4;touch-action:none}
.guide{position:absolute;background:#EC4899;z-index:6;pointer-events:none}
@media (max-width:760px){
 .top{padding:0 12px}
 .logo b,.sync span{display:none}
 .plan{width:100%;border-right:0;border-bottom:1px solid var(--border)}
 .ebody{flex-direction:column;overflow:auto}
 .ed{height:auto;min-height:calc(100vh - 55px)}
 .stage{min-height:70vh;padding:14px 8px}
 .ehead input.th{width:130px}
 .btn .lg{display:none}
}
</style>
</head>
<body>
<header class="top">
<a class="logo" href="#accueil" aria-label="Fiches DSCG, accueil"><i><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></i><b>Fiches DSCG</b></a>
<nav class="nav" aria-label="Menu principal">
<a href="#accueil" data-nav="accueil">Accueil</a>
<a href="#fiches" data-nav="fiches">Mes fiches</a>
<button type="button" id="ueMenuBtn" aria-haspopup="true">Par UE <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
<a href="#exporter" data-nav="exporter">Exporter</a>
<a href="#personnaliser" data-nav="personnaliser">Personnaliser</a>
</nav>
<span class="sync" id="sync" role="status"><i></i><span>Chargement…</span></span>
<button type="button" class="btn pri" id="newBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="lg">Nouvelle fiche</span></button>
</header>
<main id="view"></main>
<div id="measure"></div>
<div id="exporthost"></div>
<script>
(function(){
'use strict';
/* ---------------- helpers ---------------- */
var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function uid(p){ return (p||'i') + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

function curPage(){ return ED.f.pages[ED.pi]; }
function touchSoft(){ ED.f.updated=Date.now(); edDirty(); Store.saveFiche(ED.f); }
function touch(){ ED.f.updated=Date.now(); edDirty(); Store.saveFiche(ED.f); updUndo(); }
function hm(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function edStat(t,dirty){ var e=$('#eStat'); if(!e) return; e.textContent=t; e.classList.toggle('dirty',!!dirty); }
function edDirty(){ if(ED){ ED.dirty=true; edStat('Modifications non enregistrées',true); } }
function edSaved(id){ if(ED && ED.fid===id && !Store.timers[id]){ ED.dirty=false; edStat((Store.mode==='db'?'Enregistré à ':'Enregistré sur cet appareil à ')+hm(new Date()),false); if(ED.manual){ ED.manual=false; toast(Store.mode==='db'?'Fiche enregistrée dans ton compte.':'Fiche enregistrée sur cet appareil.'); } } }
function saveNow(){ if(!ED) return; commitEdit(); ED.f.updated=Date.now(); ED.manual=true; edStat('Enregistrement…',false); Store.saveFiche(ED.f,true); }

function undo(){ commitEdit(); if(!ED.undo.length) return; ED.redo.push(JSON.stringify(ED.f.pages)); ED.f.pages=JSON.parse(ED.undo.pop()); ED.pi=clamp(ED.pi,0,ED.f.pages.length-1); ED.sel=null; touch(); drawAll(); }
function redo(){ commitEdit(); if(!ED.redo.length) return; ED.undo.push(JSON.stringify(ED.f.pages)); ED.f.pages=JSON.parse(ED.redo.pop()); ED.pi=clamp(ED.pi,0,ED.f.pages.length-1); ED.sel=null; touch(); drawAll(); }

    fiches.forEach(function(f){ f.pages.forEach(function(p,pi){ seq=seq.then(function(){
      n++; busy('Création du PDF… page '+n+' / '+total);
      host.innerHTML=''; var pg=document.createElement('div'); host.appendChild(pg); renderPage(pg,f,pi,{});
      return window.html2canvas(pg,{ scale:2, backgroundColor:'#ffffff', logging:false, useCORS:true, width:PW, height:PH, windowWidth:PW }).then(function(cv){
        if(!first) pdf.addPage('a4','portrait'); first=false;
        pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
      });
    }); }); });
    return seq.then(function(){ host.innerHTML=''; busy(null); var blob=pdf.output('blob');
      if(!dl){ toast('Le téléchargement n’est pas disponible dans cette vue. Ouvre l’outil dans claude.ai depuis un navigateur.'); return; }
      return dl.save({ filename:safeName(name)+'.pdf', data:blob }).then(function(res){ if(res && res.status==='saved') toast('PDF enregistré.'); }, function(e){ if(e && e.code==='declined') return; toast('Le PDF n’a pas pu être enregistré.'); });
    });
  }).catch(function(e){ busy(null); $('#exporthost').innerHTML=''; toast('La création du PDF a échoué. Vérifie ta connexion et réessaie.'); });
}
function downloadBackup(){
  getDownloads().then(function(dl){
    if(!dl){ toast('Le téléchargement n’est pas disponible dans cette vue.'); return; }
    var data=JSON.stringify({ app:'fiches-dscg', version:1, exported:new Date().toISOString(), settings:S.settings, fiches:S.fiches }, null, 1);
    var d=new Date(); var nm='sauvegarde-fiches-dscg-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
    dl.save({ filename:nm, data:data }).then(function(r){ if(r && r.status==='saved'){ try{ localStorage.setItem('fichesDSCG.lastBackup', String(Date.now())); }catch(e){} toast('Sauvegarde téléchargée.'); if(curRoute().name==='accueil'||curRoute().name==='personnaliser') route(true); } }, function(e){ if(e && e.code!=='declined') toast('La sauvegarde n’a pas pu être enregistrée.'); });
  });
}
function importBackup(e){
  var file=e.target.files && e.target.files[0]; if(!file) return;
  var rd=new FileReader(); rd.onload=function(){
    try{ var o=JSON.parse(rd.result); if(!o || !Array.isArray(o.fiches)) throw 0;
      var ids={}; S.fiches.forEach(function(f){ ids[f.id]=f; }); var added=0, upd=0;
      o.fiches.forEach(function(f){ if(!f || !f.id || !Array.isArray(f.pages) || !/^[A-Za-z0-9]+$/.test(f.id)) return; if(UE_KEYS.indexOf(f.ue)<0) f.ue='UE1'; var ex=ids[f.id]; if(ex){ if((f.updated||0)>(ex.updated||0)){ S.fiches[S.fiches.indexOf(ex)]=f; Store.saveFiche(f,true); upd++; } } else { S.fiches.push(f); Store.saveFiche(f,true); added++; } });
      if(o.settings){ S.settings=mergeSettings(o.settings); Store.saveSettings(); }
      toast(added+' fiche(s) ajoutée(s), '+upd+' mise(s) à jour.'); route(true);
    }catch(er){ toast('Ce fichier n’est pas une sauvegarde valide.'); }
  }; rd.readAsText(file);
}

/* ---------------- start ---------------- */
window.addEventListener('resize', function(){ var r=curRoute(); if(r.name==='lire'||r.name==='fiches'||r.name==='exporter'){ clearTimeout(window.__rz); window.__rz=setTimeout(function(){ route(true); },200); } });
setSync('loading');
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
Store.init();
})();
