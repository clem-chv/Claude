<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Créer, ranger et exporter ses fiches de révision du DSCG.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A1A18'/%3E%3Cpath d='M10 10h12M10 16h12M10 22h7' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Fiches DSCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--panel:#F7F7F5;--border:#E4E4E0;--strong:#CFCFC9;--text:#1A1A18;--muted:#5E5E58;--active:#F0F0EC;--hover:#FAFAF8;--stage:#F2F2EF;--input:#FFFFFF;--ink:#1A1A18;--on-ink:#FFFFFF;--ink-hover:#33332F;--veil:rgba(255,255,255,.85);--focus:#2457D6;color-scheme:light}
html[data-theme="gris"]{--bg:#E6E6E2;--surface:#EFEFEB;--panel:#E3E3DF;--border:#CFCFC9;--strong:#B5B5AE;--text:#1A1A18;--muted:#4F4F4A;--active:#DCDCD7;--hover:#E8E8E4;--stage:#D3D3CE;--input:#F7F7F4;--ink:#26262A;--on-ink:#FFFFFF;--ink-hover:#3A3A3F;--veil:rgba(230,230,226,.85)}
html[data-theme="sombre"]{--bg:#17181A;--surface:#1F2023;--panel:#1B1C1F;--border:#313338;--strong:#474A51;--text:#ECECE8;--muted:#A6A6A0;--active:#2C2E33;--hover:#26282C;--stage:#0F1012;--input:#26282C;--ink:#ECECE8;--on-ink:#17181A;--ink-hover:#D4D4CF;--veil:rgba(23,24,26,.85);--focus:#8AA8FF;color-scheme:dark}
html[data-theme="sombre"] .page{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 8px 30px rgba(0,0,0,.45)}
html[data-theme="sombre"] .tb:hover,html[data-theme="sombre"] .menu-pop button:hover{background:var(--active)}
html[data-theme="sombre"] .rtab.fmt.has,html[data-theme="sombre"] .rtab.fmt.on{color:#8AA8FF;border-bottom-color:#8AA8FF}
html[data-theme="sombre"] .toast{background:#ECECE8;color:#17181A}
.thb{width:38px;min-height:38px;padding:0}
.aiwrap{max-width:1400px}
.aistep{margin-top:18px;gap:10px}
.aistep[hidden]{display:none}
.aistep>.seg,.aistep>.aichip,.aistep>label.aichip{align-self:flex-start}
.aisth{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.aisth h2{font-size:18px;margin:0}
.ainum{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-weight:700;font-size:14px;flex:none}
.aimut{font-size:13px;color:var(--muted)}
.aif{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.aif input,.aif select,.aif textarea{height:38px;padding:0 10px;border:1px solid var(--strong);border-radius:6px;background:var(--input);font-size:14px;color:var(--text);font-family:inherit}
.aif textarea{height:auto;padding:8px 10px;resize:vertical}
.aigrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.airow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.aichips{display:flex;flex-wrap:wrap;gap:8px}
.aichip{display:flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border:1px solid var(--border);border-radius:17px;font-size:13.5px;cursor:pointer;background:var(--surface)}
.aichip:has(input:checked){border-color:var(--ink);background:var(--active)}
.aidrop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:140px;border:2px dashed var(--strong);border-radius:10px;cursor:pointer;color:var(--muted);text-align:center;padding:16px}
.aidrop b{color:var(--text);font-size:15px}
.aidrop .ico{width:28px;height:28px}
.aidrop.over,.aidrop:hover{border-color:var(--focus);background:var(--hover)}
.aiimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.aiimg{position:relative;display:flex;flex-direction:column;gap:4px;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--surface)}
.aiimg img,.aipdf{width:100%;height:110px;object-fit:cover;border-radius:4px;background:#f3f3f0}
.aipdf{display:flex;align-items:center;justify-content:center;font-weight:700;color:#B42318;font-size:20px}
.aiimg span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aiimgb{display:flex;justify-content:flex-end;gap:2px}
.aiest{font-size:14px}
.aiwarn{margin-top:6px;color:#B54708;font-size:13px}
.aierr{color:#B42318}
.aiok{display:inline-flex;align-items:center;gap:8px;color:#067647;font-size:14px;font-weight:500}
.aispin{display:inline-block;width:14px;height:14px;border:2px solid var(--strong);border-top-color:var(--ink);border-radius:50%;animation:aisp 0.8s linear infinite;vertical-align:-2px;margin-right:4px}
@keyframes aisp{to{transform:rotate(360deg)}}
.aicr{display:flex;flex-wrap:wrap;align-items:flex-end;gap:28px}
.aibig{font-size:32px;font-weight:700;letter-spacing:-.01em;color:#067647}
.aicr.mid .aibig{color:#B54708}.aicr.low .aibig{color:#B42318}
.aicrs{display:flex;gap:26px}
.aicrs>div{display:flex;flex-direction:column;gap:2px}
.aicrs b{font-size:16px}
.aibar{height:6px;border-radius:3px;background:var(--active);margin:12px 0;overflow:hidden}
.aibar i{display:block;height:100%;background:#12B76A}
.aicr.mid+.aibar i{background:#F79009}.aicr.low+.aibar i{background:#F04438}
.aihist{margin-top:12px;font-size:13px}
.aihist summary{cursor:pointer;color:var(--muted)}
.aihist table{width:100%;border-collapse:collapse;margin-top:8px}
.aihist th,.aihist td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.aitwo{display:grid;grid-template-columns:minmax(360px,0.9fr) minmax(0,1.1fr);gap:22px;align-items:start}
.aied{display:flex;flex-direction:column;gap:12px}
.aipg{border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.aipgh{display:flex;align-items:center;gap:8px}
.aipgh input{flex:1;min-width:0;height:32px;padding:0 8px;border:1px solid var(--strong);border-radius:6px;background:var(--input);font-size:13px;color:var(--text)}
.aibl{border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:6px}
.aiblh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.aiblh select,.aiblh input{height:30px;padding:0 6px;border:1px solid var(--strong);border-radius:6px;background:var(--input);font-size:13px;color:var(--text)}
.aibl textarea{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid var(--border);border-radius:5px;background:var(--input);font:13.5px/1.45 Inter,system-ui,sans-serif;color:var(--text);resize:vertical}
.aiprevw{position:sticky;top:76px}
.aiprev{display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 120px);overflow:auto;padding:2px}
.aipw{box-shadow:0 1px 3px rgba(0,0,0,.12);background:#fff;overflow:hidden;flex:none}
@media (max-width:1000px){ .aigrid{grid-template-columns:1fr 1fr} .aitwo{grid-template-columns:1fr} .aiprevw{position:static} }

.tbl .dg1{text-align:right;padding-left:35%;white-space:nowrap;min-height:1.45em}
.tbl td[contenteditable] .dg1:empty::before,.tbl td[contenteditable] .dg2:empty::before{content:attr(data-ph);opacity:.45;font-weight:400}
.tbl td[contenteditable] .dg1,.tbl td[contenteditable] .dg2{outline:1px dashed rgba(127,127,127,.35);outline-offset:1px;cursor:text}
.tbl .dg2{text-align:left;padding-right:35%;margin-top:8px;white-space:nowrap;min-height:1.45em}
.tsepc,.tsepr{position:absolute;z-index:6;touch-action:none}
.tsepc{top:0;width:8px;cursor:col-resize;z-index:7}
.tsepr{left:0;height:8px;cursor:row-resize}
.tsepc:hover,.tsepc:active{background:linear-gradient(90deg,transparent 3px,#2563EB 3px,#2563EB 5px,transparent 5px)}
.tsepr:hover,.tsepr:active{background:linear-gradient(180deg,transparent 3px,#2563EB 3px,#2563EB 5px,transparent 5px)}
.menu-pop.sympop{width:330px;max-height:70vh;overflow:auto;padding:10px}
.sylab{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:8px 2px 4px}
.sygrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.menu-pop .sygrid button{width:auto;min-height:0;height:28px;padding:0;justify-content:center;border:1px solid var(--border);border-radius:5px;font-size:15px;font-family:Inter,'Segoe UI Symbol','Segoe UI Emoji',system-ui,sans-serif}
.menu-pop .sygrid button:hover{background:var(--active);border-color:var(--strong)}
.schcard{display:flex;gap:16px;padding:14px 0;border-top:1px solid var(--border);align-items:flex-start}
.schpv{flex:none;width:200px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:4px}
.schf{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.schh{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.schrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:13px;color:var(--muted)}
.schrow label{display:flex;align-items:center;gap:6px}
.schn{width:56px;height:32px;padding:0 6px;border:1px solid var(--strong);border-radius:6px;background:var(--input);color:var(--text)}
.schc{display:inline-flex;align-items:center;gap:6px}
.schc i{font-style:normal;opacity:.7}
.schc .cswatch{width:30px;height:26px}
.schrn{height:30px;padding:0 8px;border:1px solid var(--strong);border-radius:6px;background:var(--input);font-size:14px;color:var(--text);min-width:0;width:220px}
.menu-pop.tpick{min-width:0;width:auto;padding:10px}
.tgrid{display:grid;grid-template-columns:repeat(10,22px);gap:3px}
.menu-pop .tgrid button{width:22px;min-height:0;height:22px;padding:0;border:1px solid var(--strong);border-radius:3px;background:var(--surface)}
.menu-pop .tgrid button.on{background:#DCE6FB;border-color:#2563EB}
html[data-theme="sombre"] .menu-pop .tgrid button.on{background:#2A3F6E;border-color:#8AA8FF}
.tcust{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:13px}
.tcust label{display:flex;align-items:center;gap:4px;white-space:nowrap}
.tcust input{width:52px;height:30px;padding:0 6px;border:1px solid var(--strong);border-radius:6px;background:var(--input)}
.krow{display:flex;align-items:center;gap:8px;min-height:38px;border-top:1px solid var(--border)}
.krow .kn{flex:1;display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.krow .kn .ico{width:16px;height:16px;flex:none}
.kbtn{min-width:120px;height:30px;padding:0 10px;border:1px solid var(--strong);border-radius:6px;background:var(--input);font:600 12.5px/1 ui-monospace,Menlo,monospace;color:var(--text)}
.kbtn.none{font-family:Inter,system-ui,sans-serif;font-weight:400;color:var(--muted)}
.kbtn.rec{border-color:var(--focus);box-shadow:0 0 0 2px var(--focus);font-family:Inter,system-ui,sans-serif;font-weight:500}
.kclr{width:30px;height:30px;border:0;background:transparent;border-radius:6px;font-size:18px;color:var(--muted);flex:none}
.kclr:hover{background:var(--active);color:var(--text)}
.krow.dup .kbtn{border-color:#D92D20;color:#D92D20;box-shadow:0 0 0 1px #D92D20}
.krow.dup .kn small{color:#D92D20}
.krow.warn .kn small{color:#B54708}
.krow .kn>span{display:flex;flex-direction:column;min-width:0}
.krow .kn small{font-size:12px;line-height:1.3}
html[data-theme="sombre"] .krow.dup .kbtn,html[data-theme="sombre"] .krow.dup .kn small{color:#FF8A80;border-color:#FF8A80;box-shadow:0 0 0 1px #FF8A80}
.kwarn{margin:6px 0;padding:8px 10px;border-radius:6px;background:#FEF3F2;border:1px solid #FDA29B;color:#B42318;font-size:13px}
html[data-theme="sombre"] .kwarn{background:#3A1E1C;border-color:#7A2E28;color:#FFB4AB}
.kfind{height:36px;padding:0 12px;border:1px solid var(--strong);border-radius:6px;background:var(--input);font-size:14px;color:var(--text);margin-top:4px}
.krow[hidden],.kgrp[hidden]{display:none}
.kgrp{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
.kgrp:first-child{margin-top:4px}
.binl{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer}
.bxrow input[type=text]{flex:1;min-width:0;height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--strong);background:var(--input);font-size:14px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--text)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
/* top bar */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:4px;padding:0 24px;height:58px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;margin-right:22px;text-decoration:none;color:var(--text);flex:none}
.logo i{width:22px;height:22px;border-radius:4px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.logo i .ico{width:13px;height:13px}
.logo b{font-family:'Source Serif 4',Georgia,serif;font-size:19px;font-weight:600}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;height:100%}
.nav::-webkit-scrollbar{display:none}
.nav a,.nav button{flex:none;height:100%;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nav a:hover,.nav button:hover{color:var(--text)}
.nav .on{color:var(--text);border-bottom-color:var(--ink)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none;margin-right:10px}
.sync i{width:7px;height:7px;border-radius:9px;background:#2E9E62}
.sync.warn i{background:#D97706}
.btn{min-height:38px;padding:0 14px;border-radius:6px;border:1px solid var(--strong);background:var(--surface);font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--text);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--active)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.pri:hover{background:var(--ink-hover)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--active)}
.btn.danger{color:#B42318}
.btn[disabled]{opacity:.4;cursor:default;background:var(--surface)}
.ico{width:16px;height:16px;flex:none}
.menu-pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px;min-width:280px;box-shadow:0 8px 24px rgba(20,20,18,.10)}
.menu-pop button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;background:transparent;border-radius:5px;text-align:left;font-size:14px}
.menu-pop button:hover{background:var(--active)}
.dot{width:9px;height:9px;border-radius:2px;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text);flex:none;white-space:nowrap}
.tag .dot{width:8px;height:8px}
.pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:12px;font-weight:700;flex:none}
/* layout */
.wrap{max-width:1880px;margin:0 auto;padding:28px clamp(16px,2.4vw,40px) 64px}
.homegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:36px;align-items:start}
.hside{position:sticky;top:78px;display:flex;flex-direction:column;gap:12px}
.hside .tiles{grid-template-columns:1fr;gap:8px}
.hside .tile{padding:11px 14px}
.hside h2{font-size:19px}
@media (max-width:980px){ .homegrid{grid-template-columns:1fr} .hside{position:static} .hside .tiles{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))} }
.ptitle{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;padding-bottom:22px;border-bottom:1px solid var(--border)}
.ptitle h1{font-size:30px}
.ptitle p{margin:6px 0 0;color:var(--muted);font-size:14px}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid var(--strong);border-radius:6px;background:var(--surface);width:100%;max-width:640px;color:var(--muted)}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;border:0;outline:none;background:transparent;font-size:15px;min-width:0;color:var(--text)}
.search small{font-size:12px;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--strong);border-radius:6px;overflow:hidden;width:max-content;max-width:100%}
.tabs button{min-height:36px;padding:0 13px;border:0;border-left:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;color:var(--muted)}
.tabs button:first-child{border-left:0}
.tabs button:hover{color:var(--text);background:var(--active)}
.tabs button.on{background:var(--active);color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.sec{display:flex;flex-direction:column;gap:14px;margin-top:40px}
.sec h2{font-size:21px}
.sec p.d{margin:-8px 0 0;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{text-align:left;padding:14px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--strong);background:var(--hover)}
.tile.on{border-color:var(--ink)}
.tile .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile .n{font-size:15px;font-weight:600;line-height:1.35}
.tile .m{font-size:13px;color:var(--muted)}
.list{border-top:1px solid var(--border)}
.list a{display:flex;align-items:center;gap:16px;min-height:52px;padding:8px 4px;border-bottom:1px solid var(--border);color:var(--text);text-decoration:none}
.list a:hover{background:var(--hover)}
.list .ti{flex:1;min-width:0;font-weight:500}
.list .mt{font-size:13px;color:var(--muted);white-space:nowrap}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--strong);border-radius:8px;display:flex;flex-direction:column;gap:12px;align-items:center}
.panel{padding:20px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.lab{font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;min-height:50px;border-top:1px solid var(--border)}
.row input[type=text]{flex:1;min-width:0;height:36px;padding:0 10px;border-radius:6px;border:1px solid var(--strong);background:var(--surface)}
input[type=color]{width:40px;height:32px;padding:2px;border:1px solid var(--strong);border-radius:6px;background:var(--surface);flex:none}
.two{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.optl{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start;margin-top:22px}

.optnav{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px;padding-right:12px;border-right:1px solid var(--border)}

var READ_NAV=null;
document.addEventListener('keydown', function(e){
  if(!READ_NAV || !/^#lire-/.test(location.hash)) return; var ae=document.activeElement; if(ae && (ae.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) return;
  var c=comboOf(e), d=0;
  if(c && c===keyOf('fprev')){ e.preventDefault(); stepFiche(-1); return; } if(c && c===keyOf('fnext')){ e.preventDefault(); stepFiche(1); return; } if(c && c===keyOf('fpick')){ e.preventDefault(); var fb=$('[data-fpick]'); if(fb) openFichePicker(fb); return; }
  if(c && c===keyOf('pgprev')) d=-1; else if(c && c===keyOf('pgnext')) d=1;
  else if(!e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey){ if(e.key==='ArrowLeft'||e.key==='PageUp') d=-1; else if(e.key==='ArrowRight'||e.key==='PageDown') d=1; }
  if(d){ e.preventDefault(); READ_NAV(d); }
});

function ficheMode(){ return /^#edit-/.test(location.hash)?'edit':'lire'; }
function goFiche(id){ if(ED && /^#edit-/.test(location.hash)) commitEdit(); location.hash='#'+ficheMode()+'-'+id; }
function curFicheId(){ var m=location.hash.match(/^#(?:edit|lire)-(.+)$/); return m?m[1]:null; }
function stepFiche(d){ var all=navOrder(), id=curFicheId(), i=-1; all.forEach(function(f,k){ if(f.id===id) i=k; }); if(i<0) return; var j=i+d; if(j<0||j>=all.length){ toast(d<0?'C’est la première fiche.':'C’est la dernière fiche.'); return; } goFiche(all[j].id); }
function ficheNavHtml(){ var all=navOrder(), id=curFicheId(), i=-1; all.forEach(function(f,k){ if(f.id===id) i=k; });
  return '<span class="fnav"><button type="button" class="btn sm ghost" data-fprev="1" aria-label="Fiche précédente" title="Fiche précédente ('+(keyOf('fprev')||'')+')"'+(i<=0?' disabled':'')+'>'+ico('<path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/>')+'</button><button type="button" class="btn sm" data-fpick="1" aria-haspopup="true" title="Aller à une autre fiche ('+(keyOf('fpick')||'')+')">'+ico('<path d="M4 6h16M4 12h16M4 18h10"/>')+'Fiches'+ico(I.down)+'</button><button type="button" class="btn sm ghost" data-fnext="1" aria-label="Fiche suivante" title="Fiche suivante ('+(keyOf('fnext')||'')+')"'+(i<0||i>=all.length-1?' disabled':'')+'>'+ico('<path d="M13 17l5-5-5-5M6 17l5-5-5-5"/>')+'</button></span>'; }
function bindFicheNav(root){ var a=$('[data-fprev]',root), b=$('[data-fnext]',root), c=$('[data-fpick]',root); if(a) a.onclick=function(){ stepFiche(-1); }; if(b) b.onclick=function(){ stepFiche(1); }; if(c) c.onclick=function(e){ e.stopPropagation(); openFichePicker(c); }; }
function openFichePicker(btn){
  closeMenus(); var id=curFicheId(), m=document.createElement('div'); m.className='menu-pop fpick'; m.setAttribute('role','dialog'); m.setAttribute('aria-label','Aller à une fiche');
  m.innerHTML='<input type="search" class="kfind" id="fpQ" placeholder="Rechercher une fiche (titre, thème, contenu)…" aria-label="Rechercher une fiche"><div class="fplist" role="listbox"></div>';
  var list=$('.fplist',m), q=$('#fpQ',m), sel=0;
  var draw=function(){ var qq=norm(q.value.trim()), all=navOrder().filter(function(f){ return !qq || norm(f.title+' '+(f.theme||'')+' '+f.ue).indexOf(qq)>=0 || norm(ficheText(f)).indexOf(qq)>=0; }), h='', last=null;
    all.forEach(function(f,i){ if(f.ue!==last){ h+='<div class="fpue"><span class="dot" style="background:'+ueColor(f.ue)+'"></span>'+esc(f.ue)+' · '+esc((S.settings.ues[f.ue]||{}).name||'')+'</div>'; last=f.ue; }
      h+='<button type="button" role="option" data-fi="'+f.id+'" class="'+(f.id===id?'cur ':'')+(i===sel?'hl':'')+'" aria-selected="'+(i===sel)+'"><span class="ft">'+esc(f.title||'Sans titre')+'</span><span class="fm">'+f.pages.length+' p.'+(f.id===id?' · ouverte':'')+'</span></button>'; });
    list.innerHTML=h||'<div class="hint" style="padding:12px;font-size:13px;color:var(--muted)">Aucune fiche ne correspond.</div>'; var hl=$('.hl',list); if(hl) hl.scrollIntoView({ block:'nearest' }); };
  q.addEventListener('input', function(){ sel=0; draw(); });
  q.addEventListener('keydown', function(e){ e.stopPropagation(); var n=$$('[data-fi]',list).length; if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(n-1,sel+1); draw(); } else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(0,sel-1); draw(); } else if(e.key==='Enter'){ e.preventDefault(); var t=$$('[data-fi]',list)[sel]; if(t){ closeMenus(); goFiche(t.getAttribute('data-fi')); } } else if(e.key==='Escape') closeMenus(); });
  m.addEventListener('click', function(e){ e.stopPropagation(); var t=e.target.closest('[data-fi]'); if(t){ closeMenus(); if(t.getAttribute('data-fi')!==id) goFiche(t.getAttribute('data-fi')); } });
  var cur=navOrder().map(function(f){ return f.id; }).indexOf(id); sel=Math.max(0,cur); draw();
  placePop(m, btn, 380); q.focus();
}

function aiSave(patch){ var a=S.settings.ai||{}; Object.keys(patch).forEach(function(k){ a[k]=patch[k]; }); S.settings.ai=a; Store.saveSettings(); }
function aiSpent(){ return aiCfg().history.reduce(function(t,h){ return t+(+h.cost||0); },0); }
function money(v){ return (Math.round(v*100)/100).toLocaleString('fr-FR',{ minimumFractionDigits:2, maximumFractionDigits:2 })+' $'; }
function aiKeyInfo(){ if(window.fichesAI) return window.fichesAI.key('get'); var k=''; try{ k=localStorage.getItem(AI_LS)||''; }catch(e){} return Promise.resolve({ has:!!k, tail:k.slice(-4) }); }
function aiKeySet(k){ if(window.fichesAI) return window.fichesAI.key('set',k); try{ localStorage.setItem(AI_LS,k); }catch(e){} return Promise.resolve({ has:true, tail:k.slice(-4) }); }
function aiKeyDel(){ if(window.fichesAI) return window.fichesAI.key('del'); try{ localStorage.removeItem(AI_LS); }catch(e){} return Promise.resolve({ has:false }); }
function aiPost(body, signal){
  if(window.fichesAI) return window.fichesAI.call(body);
  var k=''; try{ k=localStorage.getItem(AI_LS)||''; }catch(e){}
  return fetch(AI_URL,{ method:'POST', signal:signal, headers:{ 'x-api-key':k, 'anthropic-version':'2023-06-01', 'content-type':'application/json', 'anthropic-dangerous-direct-browser-access':'true' }, body:JSON.stringify(body) })
    .then(function(r){ return r.text().then(function(t){ return { status:r.status, body:t }; }); });
}
function aiErr(st, body){ var m=''; try{ m=(JSON.parse(body).error||{}).message||''; }catch(e){}
  if(st===401) return 'Clé API refusée : vérifie-la dans ta console Anthropic.';
  if(st===403) return 'Accès refusé par l’API ('+m+').';
  if(st===429) return 'Trop de demandes ou limite atteinte : attends une minute et réessaie.';
  if(st===529||st===503) return 'L’API est surchargée pour le moment : réessaie dans quelques minutes.';
  if(st===400 && /credit|balance/i.test(m)) return 'Crédits insuffisants sur ton compte Anthropic : recharge-le dans la console.';
  return 'Erreur '+st+(m?' : '+m:''); }

/* ---- images ---- */
function aiAddFiles(files){
  var list=Array.prototype.slice.call(files||[]); if(!list.length) return;
  var jobs=list.map(function(fl){ return new Promise(function(res){
    if(AIW.imgs.length>=20){ res(null); return; }
    if(fl.type==='application/pdf'){ if(fl.size>25*1024*1024){ toast(fl.name+' est trop lourd (25 Mo maximum).'); res(null); return; } var r=new FileReader(); r.onload=function(){ res({ id:uid('i'), name:fl.name, kind:'pdf', media:'application/pdf', data:String(r.result).split(',')[1], size:fl.size }); }; r.onerror=function(){ res(null); }; r.readAsDataURL(fl); return; }
    if(!/^image\//.test(fl.type)){ toast(fl.name+' : format non pris en charge (images ou PDF).'); res(null); return; }
    var url=URL.createObjectURL(fl), im=new Image(); im.onload=function(){ var mx=1568, sc=Math.min(1, mx/Math.max(im.width, im.height)), w=Math.round(im.width*sc), h=Math.round(im.height*sc), cv=document.createElement('canvas'); cv.width=w; cv.height=h; var cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); cx.drawImage(im,0,0,w,h); var du=cv.toDataURL('image/jpeg',0.85); URL.revokeObjectURL(url); res({ id:uid('i'), name:fl.name, kind:'image', media:'image/jpeg', data:du.split(',')[1], thumb:du, w:w, h:h }); };
    im.onerror=function(){ URL.revokeObjectURL(url); toast('Image illisible : '+fl.name); res(null); }; im.src=url; }); });
  Promise.all(jobs).then(function(r){ r.forEach(function(x){ if(x) AIW.imgs.push(x); }); if(AIW.imgs.length>=20) toast('20 documents au maximum par fiche.'); aiDrawImgs(); aiDrawEstimate(); });
}
function aiDrawImgs(){ var g=$('#aiImgs'); if(!g) return;
  g.innerHTML=AIW.imgs.map(function(x,i){ return '<div class="aiimg">'+(x.kind==='pdf'?'<div class="aipdf">PDF</div>':'<img src="'+x.thumb+'" alt="">')+'<span title="'+esc(x.name)+'">'+(i+1)+'. '+esc(x.name)+'</span><div class="aiimgb"><button type="button" class="kclr" data-imv="'+i+':-1" aria-label="Déplacer avant" title="Avant">‹</button><button type="button" class="kclr" data-imv="'+i+':1" aria-label="Déplacer après" title="Après">›</button><button type="button" class="kclr" data-imx="'+i+'" aria-label="Retirer '+esc(x.name)+'" title="Retirer">×</button></div></div>'; }).join('');
  $$('[data-imx]',g).forEach(function(b){ b.onclick=function(){ AIW.imgs.splice(+b.getAttribute('data-imx'),1); aiDrawImgs(); aiDrawEstimate(); }; });

  var c=$('#aiImgN'); if(c) c.textContent=AIW.imgs.length?AIW.imgs.length+' document'+(AIW.imgs.length>1?'s':''):'Aucun document'; }

/* ---- estimation ---- */
function aiEstimate(){ var c=aiCfg(), m=AI_MODELS[c.model], tin=1500; AIW.imgs.forEach(function(x){ tin+= x.kind==='pdf' ? Math.round(x.size/1024/1024*2500+1500) : Math.min(1650, Math.ceil(x.w*x.h/750)); });
  var tout=Math.min(16000, 1200+c.pages*(c.style==='detail'?2600:(c.style==='synth'?1400:2000))); return { tin:tin, tout:tout, cost:tin/1e6*m.pin+tout/1e6*m.pout }; }
function aiDrawEstimate(){ var e=$('#aiEst'); if(!e) return; var x=aiEstimate(), rest=aiCfg().budget-aiSpent();
  e.innerHTML='Coût estimé : <b>≈ '+money(x.cost)+'</b> <span class="aimut">(≈ '+Math.round(x.tin/100)/10+' k tokens lus, '+Math.round(x.tout/100)/10+' k écrits au maximum)</span>'+(aiCfg().budget && rest<x.cost?'<div class="aiwarn">Ton solde suivi ('+money(rest)+') est inférieur au coût estimé.</div>':''); }

/* ---- prompt ---- */
function aiPrompt(meta){
  var c=aiCfg(), st={ synth:'Style SYNTHÉTIQUE : mots-clés, phrases nominales très courtes, listes à puces, aucun paragraphe.', standard:'Style STANDARD : phrases courtes et claires, listes à puces quand c’est utile.', detail:'Style DÉTAILLÉ : explications complètes (mécanismes, conditions, exceptions), avec exemples.' }[c.style];
  var sys='Tu es un professeur expert du DSCG (diplôme supérieur de comptabilité et de gestion). Tu rédiges des fiches de révision en français à partir des documents fournis (photos de livres, notes manuscrites, PDF).\n'+
    'Règles : n’utilise que le contenu des documents, n’invente rien. Si un passage est illisible ou incertain, écris [à vérifier]. Respecte la logique du cours (plan, définitions, conditions, exceptions, exemples, chiffres).\n'+
    'Réponds UNIQUEMENT avec un objet JSON valide, sans texte ni balise autour, au format :\n'+
    '{"titre":"Titre de la fiche","pages":[{"plan":"Partie > Chapitre > Section (où on en est dans le plan)","blocs":[\n'+
    ' {"type":"titre","texte":"Sous-titre"},\n'+
    ' {"type":"encadre","nature":"definition|retenir|important|piege|exemple|methode|remarque|article","texte":"Texte. **gras** pour les mots clés. Lignes commençant par - pour les puces."},\n'+
    ' {"type":"tableau","lignes":[["En-tête 1","En-tête 2"],["cellule","cellule"]]},\n'+
    ' {"type":"schema","plan":"Notion principale\\n  Idée 1 | précision courte\\n    Détail\\n  Idée 2"},\n'+
    ' {"type":"formule","libelle":"Nom de la formule","texte":"Résultat = A - B"},\n'+
    ' {"type":"texte","texte":"Texte libre"}\n]}]}\n'+
    'Le plan d’un schéma utilise 2 espaces de retrait par niveau, 12 éléments au plus, un seul schéma par page (il occupe toute la page). Les tableaux ont 2 à 5 colonnes, la première ligne est l’en-tête.';
  var ue=ueOf(meta.ue)||{}, lay=(meta.orient==='landscape'?'paysage':'portrait')+' '+(meta.size||'A4');
  var u='Chapitre : '+meta.title+'\nUE : '+meta.ue+' – '+(ue.name||'')+'\nFormat : '+lay+', environ '+c.pages+' page'+(c.pages>1?'s':'')+' (une page '+lay+' contient environ '+(meta.orient==='landscape'?'8 à 10':'6 à 8')+' encadrés courts).\n'+st+'\n'+
    (c.tech?'Utilise le vocabulaire technique exact du DSCG (termes juridiques, comptables, financiers) et cite les références (articles, normes) quand elles figurent dans les documents.\n':'Utilise un vocabulaire simple et accessible.\n')+
    'Éléments à privilégier : '+c.parts.map(function(p){ var x=AI_PARTS.filter(function(q){ return q[0]===p; })[0]; return x?x[1]:p; }).join(', ')+'.\n'+
    (meta.plan?'Position dans le plan : '+meta.plan+'\n':'')+(c.extra?'Consignes supplémentaires : '+c.extra+'\n':'')+
    'Les '+AIW.imgs.length+' documents ci-dessus sont dans l’ordre du cours.';
  return { sys:sys, user:u };
}
function aiParse(txt){ var a=txt.indexOf('{'), b=txt.lastIndexOf('}'); if(a<0||b<a) throw new Error('Réponse illisible'); var d=JSON.parse(txt.slice(a,b+1)); if(!d || !Array.isArray(d.pages)) throw new Error('Réponse incomplète');
  d.pages=d.pages.map(function(p){ return { plan:String(p.plan||''), blocs:(Array.isArray(p.blocs)?p.blocs:[]).filter(function(b){ return b && b.type; }).map(function(b){ var o={ type:String(b.type) }; ['texte','nature','libelle','plan'].forEach(function(k){ if(b[k]!=null) o[k]=String(b[k]); }); if(Array.isArray(b.lignes)) o.lignes=b.lignes.map(function(r){ return (Array.isArray(r)?r:[r]).map(function(c){ return String(c==null?'':c); }); }); return o; }) }; });
  return { titre:String(d.titre||''), pages:d.pages }; }

function aiGenerate(){
  if(AIW.busy) return; var meta=aiMeta(); if(!meta.title){ toast('Indique le titre du chapitre (étape 2).'); var t=$('#aiTitle'); if(t) t.focus(); return; }
  if(!AIW.imgs.length){ toast('Ajoute au moins une photo ou un PDF de ton cours (étape 3).'); return; }
  aiKeyInfo().then(function(ki){ if(!ki || !ki.has){ toast('Enregistre d’abord ta clé API (étape 1).'); var k=$('#aiKey'); if(k) k.focus(); return; }
    var c=aiCfg(), pr=aiPrompt(meta), content=AIW.imgs.map(function(x){ return x.kind==='pdf'?{ type:'document', source:{ type:'base64', media_type:'application/pdf', data:x.data } }:{ type:'image', source:{ type:'base64', media_type:x.media, data:x.data } }; });
    content.push({ type:'text', text:pr.user });
    var body={ model:c.model, max_tokens:16000, system:pr.sys, messages:[{ role:'user', content:content }] };
    AIW.busy=true; AIW.ctrl=window.AbortController?new AbortController():null; var t0=Date.now(), st=$('#aiRun');
    var tick=setInterval(function(){ if(st) st.innerHTML='<span class="aispin"></span> Lecture des documents et rédaction… '+Math.round((Date.now()-t0)/1000)+' s <button type="button" class="btn sm ghost" id="aiStop">Annuler</button>'; var sb=$('#aiStop'); if(sb) sb.onclick=function(){ AIW.cancel=true; if(AIW.ctrl) AIW.ctrl.abort(); }; }, 500);
    AIW.cancel=false; var gb=$('#aiGo'); if(gb) gb.disabled=true;
    aiPost(body, AIW.ctrl && AIW.ctrl.signal).then(function(r){
      clearInterval(tick); AIW.busy=false; if(gb) gb.disabled=false;
      if(AIW.cancel){ if(st) st.textContent='Annulé.'; return; }
      if(r.status!==200){ if(st) st.innerHTML='<span class="aierr">'+esc(aiErr(r.status, r.body))+'</span>'; return; }
      var j=JSON.parse(r.body), txt=(j.content||[]).filter(function(x){ return x.type==='text'; }).map(function(x){ return x.text; }).join(''), u=j.usage||{}, m=AI_MODELS[c.model];
      var cost=(u.input_tokens||0)/1e6*m.pin+(u.output_tokens||0)/1e6*m.pout+(u.cache_creation_input_tokens||0)/1e6*m.pin*1.25+(u.cache_read_input_tokens||0)/1e6*m.pin*0.05;
      var h=aiCfg().history.slice(); h.push({ t:Date.now(), title:meta.title, model:c.model, inTok:u.input_tokens||0, outTok:u.output_tokens||0, cost:Math.round(cost*10000)/10000, docs:AIW.imgs.length }); aiSave({ history:h });
      var d; try{ d=aiParse(txt); }catch(e){ if(st) st.innerHTML='<span class="aierr">La réponse n’a pas pu être lue ('+esc(e.message)+'). Coût : '+money(cost)+'. Réessaie, éventuellement avec moins de documents.</span>'; aiDrawCredits(); return; }
      if(!d.titre) d.titre=meta.title; AIW.draft=d; AIW.cfg=meta; aiStoreDraft();
      if(st) st.innerHTML='Pré-fiche prête en '+Math.round((Date.now()-t0)/1000)+' s · coût réel '+money(cost)+' ('+(u.input_tokens||0)+' + '+(u.output_tokens||0)+' tokens'+(j.stop_reason==='max_tokens'?', réponse coupée : réduis le nombre de pages':'')+').';
      aiDrawCredits(); aiDrawDraft(); var s6=$('#aiStep6'); if(s6) s6.scrollIntoView({ behavior:'smooth', block:'start' });
    }, function(e){ clearInterval(tick); AIW.busy=false; if(gb) gb.disabled=false; if(st) st.innerHTML='<span class="aierr">'+(AIW.cancel?'Annulé.':'Connexion à l’API impossible. Vérifie ta connexion internet.'+(window.fichesAI?'':' Dans la version en ligne ouverte dans Claude, les appels externes sont bloqués : utilise l’exe ou la version GitHub.'))+'</span>'; });
  });
}
function aiMeta(){ var g=function(id){ var e=$(id); return e?e.value:''; }; return { title:g('#aiTitle').trim(), ue:g('#aiUe')||'UE1', orient:g('#aiOr')||'landscape', size:g('#aiSz')||'A4', plan:g('#aiPlan').trim() }; }
function aiStoreDraft(){ try{ localStorage.setItem(AI_DRAFT, JSON.stringify({ d:AIW.draft, c:AIW.cfg })); }catch(e){} }

/* ---- construction de la fiche ---- */
function aiBuildFiche(d, meta){
  var f=newFiche(meta.ue, d.titre||meta.title, ''); f.pages=[]; var host=document.createElement('div'); host.style.cssText='position:fixed;left:-20000px;top:0;visibility:hidden'; document.body.appendChild(host);
  var mkPage=function(plan){ var p=newPage(meta.orient==='landscape'?'landscape':null); if(meta.size && meta.size!=='A4') p.size=meta.size; if(plan) p.crumb=plan; f.pages.push(p); return p; };
  var measure=function(it, p){ useDims(p); var pg=document.createElement('div'); pg.className='page'; pg.style.width=PW+'px'; pg.style.height=PH+'px'; host.innerHTML=''; host.appendChild(pg); var el=buildItem(it, f, {}); pg.appendChild(el); return el.offsetHeight; };
  var toItem=function(b){ var tx=b.texte||'';
    if(b.type==='titre') return { id:uid(), type:'text', size:'h2', text:tx };
    if(b.type==='texte') return { id:uid(), type:'text', size:'body', text:tx };
    if(b.type==='formule') return { id:uid(), type:'formula', label:b.libelle||'', text:tx };
    if(b.type==='tableau'){ var rows=(b.lignes||[]).filter(function(r){ return r.length; }); if(!rows.length) return null; var n=Math.max.apply(null, rows.map(function(r){ return r.length; })); rows=rows.map(function(r){ r=r.slice(); while(r.length<n) r.push(''); return r; }); return { id:uid(), type:'table', header:rows.length>1, rows:rows }; }
    if(b.type==='encadre'){ var k=BOXK[b.nature]?b.nature:'retenir'; return { id:uid(), type:'box', kind:k, text:tx }; }
    return null; };
  (d.pages||[]).forEach(function(lp){
    var P=mkPage(lp.plan), schemas=[];
    var flow=function(){ var pi=f.pages.length-1; useDims(P); var top=contentTop(pi)+6, ncol=(isLand(P)&&PW>900)?2:1, gap=16; return { top:top, bottom:CONTENT_BOTTOM-4, n:ncol, gap:gap, cw:(PW-2*M-gap*(ncol-1))/ncol, y:[top,top,top].slice(0,ncol) }; };
    var F=flow();
    (lp.blocs||[]).forEach(function(b){
      if(b.type==='schema'){ if(b.plan) schemas.push(b.plan); return; }
      var it=toItem(b); if(!it) return;
      var full=(it.type==='table'||(it.type==='text'&&it.size==='h2')||F.n===1), place=function(){ var c=0; if(!full){ for(var q=1;q<F.n;q++) if(F.y[q]<F.y[c]) c=q; } var y=full?Math.max.apply(null,F.y):F.y[c]; it.x=Math.round(full?M:M+c*(F.cw+F.gap)); it.y=Math.round(y); it.w=Math.round(full?PW-2*M:F.cw); return c; };
      var c=place(), h=measure(it, P);
      if(it.y+h>F.bottom && P.items.length){ P=mkPage(lp.plan); F=flow(); c=place(); h=measure(it, P); }
      P.items.push(it);
      if(full){ var ny=it.y+h+F.gap; F.y=F.y.map(function(){ return ny; }); } else F.y[c]=it.y+h+F.gap;

function recentSyms(){ try{ var r=JSON.parse(localStorage.getItem(SYM_KEY)||'[]'); return Array.isArray(r)?r.slice(0,16):[]; }catch(e){ return []; } }
function insertSymbol(ch){
  var r=recentSyms().filter(function(x){ return x!==ch; }); r.unshift(ch); try{ localStorage.setItem(SYM_KEY, JSON.stringify(r.slice(0,16))); }catch(e){}
  if(ED.editing){ var rg=ED.lastRange, root=rg?editRootOf(rg.startContainer):null; if(!root) root=$('#page [data-edit]')||$('#page td[contenteditable]'); if(!root) return; root.focus(); if(rg && editRootOf(rg.startContainer)){ var sl=window.getSelection(); sl.removeAllRanges(); sl.addRange(rg); } document.execCommand('insertText', false, ch); var s2=window.getSelection(); if(s2.rangeCount) ED.lastRange=s2.getRangeAt(0).cloneRange(); return; }
  var it=ED.sel && findItem(curPage(),ED.sel);
  if(it && hasText(it) && it.type!=='table' && it.type!=='formula' && (!ED.multi || ED.multi.length<2)){ startEdit(it.id); setTimeout(function(){ var ed=$('#page [data-edit]'); if(!ed) return; ed.focus(); var r2=document.createRange(); r2.selectNodeContents(ed); r2.collapse(false); var sl=window.getSelection(); sl.removeAllRanges(); sl.addRange(r2); document.execCommand('insertText', false, ch); }, 30); return; }
  addItem('text'); setTimeout(function(){ var ed=$('#page [data-edit]'); if(ed){ ed.focus(); document.execCommand('selectAll', false, null); document.execCommand('insertText', false, ch); } }, 30);
}

  ED.editSnap=JSON.stringify(ED.f.pages); ED.editing=id; drawPage();
  var el=$('#page [data-id="'+id+'"]'); if(!el) return;
  var t=el.querySelector('[data-edit]')||el.querySelector('td[contenteditable]'); if(!t) return;
  if(t.tagName==='TD') ED.cell={ r:+t.getAttribute('data-r'), c:+t.getAttribute('data-c') };
  t.focus(); try{ var r=document.createRange(); r.selectNodeContents(t); if(it.text==='Nouveau bloc'||it.text==='Texte'||it.text==='Écris ici.'){ } else r.collapse(false); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); }catch(er){}
  try{ document.execCommand('styleWithCSS', false, false); }catch(er){}
  drawProps();
}
function commitEdit(){
  if(!ED || !ED.editing) return; var id=ED.editing, it=findItem(curPage(),id), el=$('#page [data-id="'+id+'"]');
  ED.editing=null;
  if(it && el){
    if(it.type==='table'){ $$('td[contenteditable]',el).forEach(function(td){ var r=+td.getAttribute('data-r'), c=+td.getAttribute('data-c'); if(!it.rows[r]) return; var d1=td.querySelector('.dg1'), d2=td.querySelector('.dg2'); if(it.diag && it.diag[r+','+c] && (d1||d2)){ var t1=d1?cleanHtml(d1.innerHTML).replace(/<br\s*\/?>/gi,' '):'', t2=$$('.dg2',td).map(function(x){ return cleanHtml(x.innerHTML); }).join('<br>'); it.rows[r][c]=t1+'<br>'+t2; } else it.rows[r][c]=cleanHtml(td.innerHTML); }); it.rich=true; }
    else { var t=el.querySelector('[data-edit]'); if(t){ var v=t.innerText.replace(/\n+$/,''); if(it.type==='node' && !v.trim()) v='…'; it.text=v; if(t.getAttribute('data-rich')){ var h=cleanHtml(t.innerHTML); if(hasFmt(h)) it.html=h; else delete it.html; } } }
    if(JSON.stringify(ED.f.pages)!==ED.editSnap){ ED.undo.push(ED.editSnap); ED.redo=[]; if(it.gen && it.type==='node') syncPlanText(it); touch(); }
  }
  ED.editSnap=null; drawPage(); drawProps();
}
function syncPlanText(it){
  var p=curPage(); if(!p.plan) return; var nl=it.text.split('\n'); var first=nl[0], rest=nl.slice(1).join(' ');
  /* keep plan coherent: replace the matching line if the old title is found */
  var old=null; try{ var prev=JSON.parse(ED.editSnap); prev[ED.pi].items.forEach(function(x){ if(x.id===it.id) old=x; }); }catch(e){}
  if(!old) return; var of=old.text.split('\n')[0];
  var lines=p.plan.split('\n'); for(var i=0;i<lines.length;i++){ var m=lines[i].match(/^(\s*(?:[-*•]\s+)?)(.*)$/); var body=m[2].split('|')[0].trim(); if(body===of.trim()){ lines[i]=m[1]+first+(rest?' | '+rest:''); break; } }
  p.plan=lines.join('\n'); var ta=$('#plTxt'); if(ta) ta.value=p.plan;
}
document.addEventListener('keydown', function(e){
  if(!ED || curRoute().name!=='edit') return;
  if((e.ctrlKey||e.metaKey) && (e.key==='s'||e.key==='S')){ e.preventDefault(); saveNow(); return; }
  if(ED.editing){ if((e.ctrlKey||e.metaKey) && /^[biu]$/i.test(e.key)) setTimeout(syncFmtState, 0); if(e.key==='Escape'){ e.preventDefault(); commitEdit(); return; } runShortcut(e, true); return; }
  var tg=e.target, typing=tg && (tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable);
  if(typing) return;
  if(runShortcut(e, false)) return;
  var mod=e.ctrlKey||e.metaKey;
  if(mod && (e.key==='z'||e.key==='Z')){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
  if(mod && (e.key==='y'||e.key==='Y')){ e.preventDefault(); redo(); return; }
  if(e.key==='Escape'){ ED.tool=null; ED.from=null; ED.sel=null; ED.multi=[]; drawPage(); drawProps(); return; }
  if(mod && (e.key==='='||e.key==='+')){ e.preventDefault(); setZoom(0.1); return; }
  if(mod && (e.key==='-'||e.key==='_')){ e.preventDefault(); setZoom(-0.1); return; }
  if(mod && e.key==='0'){ e.preventDefault(); ED.zoom='fit'; fitPage(); return; }
  if(mod && (e.key==='c'||e.key==='C')){ e.preventDefault(); copySel(); return; }
  if(mod && (e.key==='v'||e.key==='V')){ e.preventDefault(); pasteClip(); return; }
  if(mod && (e.key==='a'||e.key==='A')){ e.preventDefault(); setSelList(curPage().items.map(function(x){ return x.id; })); return; }
  if(mod && (e.key==='d'||e.key==='D')){ e.preventDefault(); copySel(); pasteClip(); return; }
  if(mod && !e.altKey && /^[biu]$/i.test(e.key) && (ED.sel || ED.multi.length>1)){ e.preventDefault(); propAction({b:'fb',i:'fi',u:'fu'}[e.key.toLowerCase()]); return; }
  var sl=selList(); if(!sl.length) return;
  if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); delSel(); return; }
  if((e.key==='Enter'||e.key==='F2') && ED.sel){ e.preventDefault(); startEdit(ED.sel); return; }
  var st=e.shiftKey?10:1, mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if(mv){ var movers=sl.map(function(i){ return findItem(curPage(),i); }).filter(function(x){ return x && x.type!=='arrow' && !x.locked; }); if(!movers.length) return; e.preventDefault(); pushHist(); movers.forEach(function(it){ it.x+=mv[0]; it.y+=mv[1]; if(it.gen) it.moved=true; }); touch(); drawPage(); }
});

/* ---------------- export ---------------- */
var libs=null;
function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=function(){ rej(new Error('load '+src)); }; document.head.appendChild(s); }); }
function loadLibs(){ if(!libs) libs=Promise.all([loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'), loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]).catch(function(e){ libs=null; throw e; }); return libs; }
var browserDL={ save:function(r){ return new Promise(function(res){ var blob=(r.data instanceof Blob)?r.data:new Blob([r.data],{type:/\.json$/.test(r.filename)?'application/json':'application/octet-stream'}); var u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=r.filename; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },1500); res({status:'saved'}); }); } };
function getDownloads(){ return (window.claude && window.claude.use) ? window.claude.use('downloads').then(function(d){ return d||browserDL; }, function(){ return browserDL; }) : Promise.resolve(browserDL); }
function safeName(s){ return (String(s||'fiche').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80)||'fiche'); }
function busy(msg){ var b=$('.busy'); if(!msg){ if(b) b.remove(); return; } if(!b){ b=document.createElement('div'); b.className='busy'; b.setAttribute('role','status'); document.body.appendChild(b); } b.textContent=msg; }
function exportPDF(fiches, name){
  if(!fiches.length) return; commitEdit();
  var total=0; fiches.forEach(function(f){ total+=f.pages.length; });
  busy('Préparation du PDF…');
  Promise.all([loadLibs(), getDownloads(), document.fonts?document.fonts.ready:Promise.resolve()]).then(function(r){
    var dl=r[1]; var JsPDF=window.jspdf && window.jspdf.jsPDF; if(!JsPDF||!window.html2canvas) throw new Error('libs');
    var pdf=null, host=$('#exporthost'), n=0, first=true;
    var seq=Promise.resolve();
    var pcount=0;
    fiches.forEach(function(f){ var off=pcount; pcount+=f.pages.length; f.pages.forEach(function(p,pi){ seq=seq.then(function(){
      n++; busy('Création du PDF… page '+n+' / '+total);
      host.innerHTML=''; var pg=document.createElement('div'); host.appendChild(pg); renderPage(pg,f,pi,{});
      return window.html2canvas(pg,{ scale:CUR_SIZE==='A3'?1.5:2, backgroundColor:p.bg||'#ffffff', logging:false, useCORS:true, width:PW, height:PH, windowWidth:PW }).then(function(cv){
        var mm=pageMM(p), ori=mm[0]>mm[1]?'landscape':'portrait';
        if(!pdf) pdf=new JsPDF({ orientation:ori, unit:'mm', format:[mm[0],mm[1]], compress:true }); else pdf.addPage([mm[0],mm[1]], ori);
        first=false;
        pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,mm[0],mm[1]);
        try{ var pr=pg.getBoundingClientRect(), kk=mm[0]/(pr.width||PW); $$('[data-goto]',pg).forEach(function(e){ var ti=pageIdx(f, e.getAttribute('data-goto')); if(ti<0) return; var r=e.getBoundingClientRect(); pdf.link((r.left-pr.left)*kk, (r.top-pr.top)*kk, r.width*kk, r.height*kk, { pageNumber: off+ti+1 }); }); }catch(_e){}
      });
    }); }); });
    return seq.then(function(){ host.innerHTML=''; busy(null); var blob=pdf.output('blob');
      if(!dl){ toast('Le téléchargement n’est pas disponible dans cette vue. Ouvre l’outil dans claude.ai depuis un navigateur.'); return; }
      return dl.save({ filename:safeName(name)+'.pdf', data:blob }).then(function(res){ if(res && res.status==='saved') toast('PDF enregistré.'); }, function(e){ if(e && e.code==='declined') return; toast('Le PDF n’a pas pu être enregistré.'); });
    });
  }).catch(function(e){ busy(null); $('#exporthost').innerHTML=''; toast('La création du PDF a échoué. Vérifie ta connexion et réessaie.'); });
}
function downloadBackup(){
  getDownloads().then(function(dl){
    if(!dl){ toast('Le téléchargement n’est pas disponible dans cette vue.'); return; }
    var data=JSON.stringify({ app:'fiches-dscg', version:1, exported:new Date().toISOString(), settings:S.settings, fiches:S.fiches }, null, 1);
    var d=new Date(); var nm='sauvegarde-fiches-dscg-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
    dl.save({ filename:nm, data:data }).then(function(r){ if(r && r.status==='saved'){ try{ localStorage.setItem('fichesDSCG.lastBackup', String(Date.now())); }catch(e){} toast('Sauvegarde téléchargée.'); if(curRoute().name==='accueil'||curRoute().name==='personnaliser') route(true); } }, function(e){ if(e && e.code!=='declined') toast('La sauvegarde n’a pas pu être enregistrée.'); });
  });
}
function importBackup(e){
  var file=e.target.files && e.target.files[0]; if(!file) return;
  var rd=new FileReader(); rd.onload=function(){
    try{ var o=JSON.parse(rd.result); if(!o || !Array.isArray(o.fiches)) throw 0;
      var ids={}; S.fiches.forEach(function(f){ ids[f.id]=f; }); var added=0, upd=0;
      o.fiches.forEach(function(f){ if(!f || !f.id || !Array.isArray(f.pages) || !/^[A-Za-z0-9]+$/.test(f.id)) return; if(UE_KEYS.indexOf(f.ue)<0) f.ue='UE1'; var ex=ids[f.id]; if(ex){ if((f.updated||0)>(ex.updated||0)){ S.fiches[S.fiches.indexOf(ex)]=f; Store.saveFiche(f,true); upd++; } } else { S.fiches.push(f); Store.saveFiche(f,true); added++; } });
      if(o.settings){ S.settings=mergeSettings(o.settings); Store.saveSettings(); }
      toast(added+' fiche(s) ajoutée(s), '+upd+' mise(s) à jour.'); route(true);
    }catch(er){ toast('Ce fichier n’est pas une sauvegarde valide.'); }
  }; rd.readAsText(file);
}
